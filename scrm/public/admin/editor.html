<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>页面编辑器 · 超级聚合</title>
<link rel="stylesheet" href="/shared.css">
<style>
  body{background:var(--bg)}
  .wrap{max-width:1280px;margin:0 auto;padding:18px 20px 40px}
  .head{display:flex;gap:10px;align-items:center;margin-bottom:12px;flex-wrap:wrap}
  .head h1{font-size:18px;margin:0}
  .head .sp{flex:1}
  .muted{color:var(--muted);font-size:12px}
  .split{display:grid;grid-template-columns:1fr 1fr;gap:14px}
  @media(max-width:900px){.split{grid-template-columns:1fr}}
  textarea{width:100%;min-height:420px;font-family:ui-monospace,Consolas,monospace;font-size:12px}
  iframe{width:100%;height:420px;background:#fff;border:1px solid var(--line);border-radius:10px}
</style>
</head>
<body data-help="editor">
<div class="wrap">
  <div class="head"><h1>页面编辑器</h1><span class="muted" id="meta"></span><span class="sp"></span>
    <button class="btn ghost" onclick="loadPage()">重新加载</button>
    <button class="btn ghost" onclick="preview()">预览</button>
    <button class="btn ghost" onclick="editForm()">表单配置</button>
    <button class="btn" onclick="save()">保存</button>
    <a class="btn ghost" href="/admin/">返回后台</a></div>
  <div class="split">
    <div class="panel"><textarea id="src" spellcheck="false"></textarea></div>
    <div class="panel"><iframe id="frame" title="预览"></iframe></div>
  </div>
  <div class="panel" style="margin-top:14px"><h2>历史版本</h2><table><thead><tr><th>版本</th><th>时间</th><th>说明</th><th></th></tr></thead><tbody id="vers"></tbody></table></div>
</div>
<script src="/help.js"></script>
<script>
const token = localStorage.getItem('admin_token') || '';
if (!token) location.href = '/admin/';
const id = Number(new URLSearchParams(location.search).get('id') || 1);
const $ = (x) => document.getElementById(x);
const esc = (s) => String(s == null ? '' : s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
async function api(path, method = 'GET', body) {
  const r = await fetch('/api/admin' + path, { method, headers: { 'Content-Type': 'application/json', Authorization: 'Bearer ' + token }, body: body == null ? null : JSON.stringify(body) });
  const j = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(j.error || ('HTTP ' + r.status));
  return j;
}
function toast(m) { const d = document.createElement('div'); d.textContent = m; d.style.cssText = 'position:fixed;left:50%;top:20px;transform:translateX(-50%);background:#1c2740;border:1px solid #2b3850;padding:9px 16px;border-radius:10px;z-index:99'; document.body.appendChild(d); setTimeout(() => d.remove(), 2200); }
async function loadPage() {
  const p = await api('/pages/' + id);
  $('src').value = p.html || '';
  $('meta').textContent = '页面 #' + id + ' · ' + (p.name || '') + ' · /p/' + (p.slug || '');
  const v = await api('/pages/' + id + '/versions');
  $('vers').innerHTML = (v.rows || []).map((x) => `<tr><td>${x.id}</td><td>${esc(x.created_at)}</td><td>${esc(x.note || '')}</td><td><button class="btn ghost" onclick="restore(${x.id})">回滚</button></td></tr>`).join('') || '<tr><td colspan="4" class="muted">还没有版本</td></tr>';
}
async function save() {
  await api('/pages/' + id, 'PUT', { html: $('src').value });
  toast('已保存'); loadPage();
}
function preview() { $('frame').srcdoc = $('src').value; }
async function restore(vid) {
  if (!confirm('回滚到版本 #' + vid + '？')) return;
  await api('/pages/' + id + '/restore', 'POST', { version_id: vid });
  toast('已回滚'); loadPage();
}
async function editForm() {
  const cur = await api('/pages/' + id + '/form');
  const fields = prompt('表单字段 JSON（name/label/required/type/options）', JSON.stringify(cur.fields || [], null, 1));
  if (fields == null) return;
  const webhook = prompt('留咨 webhook（可空）', cur.webhook || '');
  await api('/pages/' + id + '/form', 'PUT', { fields: JSON.parse(fields), webhook });
  toast('表单配置已保存');
}
loadPage().then(preview).catch((e) => toast('加载失败：' + e.message));
</script>
</body>
</html>

<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>仿站任务 · 超级聚合</title>
<link rel="stylesheet" href="/shared.css">
<style>
  body{background:var(--bg)}
  .wrap{max-width:1100px;margin:0 auto;padding:22px 20px 60px}
  .head{display:flex;gap:10px;align-items:center;margin-bottom:14px;flex-wrap:wrap}
  .head h1{font-size:20px;margin:0}
  .head .sp{flex:1}
  .muted{color:var(--muted);font-size:12px}
</style>
</head>
<body data-help="cloner">
<div class="wrap">
  <div class="head"><h1>仿站任务</h1><span class="muted" id="stat"></span><span class="sp"></span>
    <button class="btn ghost" onclick="openEditor()">打开编辑器</button>
    <button class="btn ghost" onclick="load()">刷新</button><a class="btn ghost" href="/admin/">返回后台</a></div>
  <div class="panel">
    <div class="toolbar">
      <input id="url" placeholder="https://example.com" style="flex:1;min-width:320px">
      <input id="slug" placeholder="slug（可空）">
      <input id="name" placeholder="名称（可空）">
      <button class="btn" onclick="create()">创建仿站任务</button>
    </div>
    <div class="muted">创建后在后台抓取，状态：queued → running → staged →（确认）done /（丢弃）discarded。确认前不会生成页面。</div>
    <table style="margin-top:12px"><thead><tr><th>ID</th><th>源地址</th><th>slug</th><th>状态</th><th>阶段</th><th>大小</th><th>操作</th></tr></thead>
    <tbody id="rows"><tr><td colspan="7" class="muted">加载中…</td></tr></tbody></table>
  </div>
</div>
<script src="/help.js"></script>
<script>
const token = localStorage.getItem('admin_token') || '';
if (!token) location.href = '/admin/';
let lastPage = 1;
async function api(path, method = 'GET', body) {
  const r = await fetch('/api/admin' + path, { method, headers: { 'Content-Type': 'application/json', Authorization: 'Bearer ' + token }, body: body == null ? null : JSON.stringify(body) });
  const j = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(j.error || ('HTTP ' + r.status));
  return j;
}
function esc(s) { return String(s == null ? '' : s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c])); }
async function load() {
  try {
    const { rows } = await api('/entities/clone_jobs?limit=200');
    const jobs = (rows || []).sort((a, b) => b.id - a.id);
    document.getElementById('stat').textContent = '共 ' + jobs.length + ' 个任务';
    document.getElementById('rows').innerHTML = jobs.map((j) => {
      const status = j.status || '';
      const can = status === 'staged';
      return `<tr><td>${j.id}</td><td class="muted">${esc(j.url || '')}</td><td>${esc(j.page || '')}</td>
        <td>${status}</td><td>${esc(j.stage || '')}</td><td>${j.bytes || ''}</td>
        <td>${can ? `<button class="btn" onclick="confirmJob(${j.id})">确认入库</button> <button class="btn ghost" onclick="discard(${j.id})">丢弃</button>` : (j.page ? `<button class="btn ghost" onclick="openEditor(${j.page})">编辑页面</button>` : '-')}</td></tr>`;
    }).join('') || '<tr><td colspan="7" class="muted">还没有任务</td></tr>';
  } catch (e) { document.getElementById('rows').innerHTML = '<tr><td colspan="7" class="muted">加载失败：' + esc(e.message) + '</td></tr>'; }
}
async function create() {
  const url = document.getElementById('url').value.trim();
  if (!url) return alert('填源地址');
  try {
    const r = await api('/clone-async', 'POST', { url, slug: document.getElementById('slug').value.trim(), name: document.getElementById('name').value.trim() });
    alert('任务 #' + r.job.id + ' 已创建');
    load();
    const t = setInterval(async () => {
      const st = await api('/clone-status?id=' + r.job.id).catch(() => null);
      if (st && (st.job.status === 'staged' || st.job.status === 'failed')) { clearInterval(t); load(); }
    }, 1500);
  } catch (e) { alert('创建失败：' + e.message); }
}
async function confirmJob(id) {
  try { const r = await api('/clone-confirm', 'POST', { id }); if (r.page) lastPage = r.page.id; alert('已入库：' + (r.page && r.page.slug)); load(); }
  catch (e) { alert('确认失败：' + e.message); }
}
async function discard(id) {
  if (!confirm('丢弃任务 #' + id + '？')) return;
  try { await api('/clone-discard', 'POST', { id }); load(); } catch (e) { alert('失败：' + e.message); }
}
function openEditor(pageId) { location.href = '/admin/editor.html?id=' + (pageId || lastPage); }
load();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="light">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; script-src 'self'; connect-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'">
  <title>超级翻译 · 登录窗口 UI</title>
  <link rel="icon" type="image/png" href="assets/logo.png">
  <link rel="stylesheet" href="app.css">
</head>
<body class="font-sans text-slate-700 overflow-hidden">
  <main class="desktop-stage" aria-label="桌面登录窗口演示">
    <section id="login-window" class="login-window bg-gradient-to-br from-[#e9f2ff] via-[#dcebff] to-[#cfe3ff] rounded-2xl" aria-label="超级翻译登录" aria-describedby="demo-note">
      <header class="window-drag"><span class="sr-only">超级翻译</span></header>
      <nav class="window-controls flex items-center gap-2" aria-label="窗口控制">
        <button type="button" class="window-control minimize" id="minimize" title="最小化" aria-label="最小化窗口"><svg viewBox="0 0 12 12" aria-hidden="true"><path d="M3 6h6"/></svg></button>
        <button type="button" class="window-control maximize" id="maximize" title="最大化" aria-label="最大化窗口"><svg viewBox="0 0 12 12" aria-hidden="true"><rect x="3" y="3" width="6" height="6" rx=".5"/></svg></button>
        <button type="button" class="window-control close" id="close" title="关闭" aria-label="关闭窗口"><svg viewBox="0 0 12 12" aria-hidden="true"><path d="m3.5 3.5 5 5m0-5-5 5"/></svg></button>
      </nav>

      <div class="login-content">
        <aside class="brand-side" aria-label="品牌介绍">
          <div class="brand-lockup flex items-center gap-2.5"><img src="assets/logo.png" width="42" height="42" alt="超级翻译标志"><span class="brand-name">超级翻译</span></div>
          <p class="brand-welcome" data-i18n="welcome">欢迎您！登录超级翻译</p>
          <img class="hero-illustration" src="assets/cloud-folder.svg" alt="云端托盘上堆叠的立体蓝色文件夹与翻译数据卡片" width="344" height="288">
        </aside>

        <section class="form-side" aria-labelledby="login-title">
          <div class="form-heading flex items-center justify-between"><h1 id="login-title" data-i18n="login">登录</h1><div class="flex items-center gap-3.5"><button type="button" class="text-link" id="register" data-i18n="register">创建免费账户</button><span class="heading-divider"></span><button type="button" class="text-link" id="contact" data-i18n="contact">联系我们</button></div></div>
          <form id="login-form" novalidate autocomplete="off">
            <label class="sr-only" for="account" data-i18n="account">账号</label>
            <div class="pill-input account-field"><svg class="field-icon" viewBox="0 0 24 24" fill="none" aria-hidden="true"><circle cx="12" cy="8" r="3.5"/><path d="M5.5 20v-2a6.5 6.5 0 0 1 13 0v2"/></svg><input id="account" name="username" type="text" placeholder="ych20260808" autocomplete="off" maxlength="80" spellcheck="false" aria-required="true" aria-describedby="form-status"><button type="button" class="saved-account-toggle" id="saved-account-toggle" aria-label="选择已保存账号" aria-expanded="false" hidden><svg viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="m4 6 4 4 4-4"/></svg></button><div id="saved-account-menu" class="saved-account-menu" hidden role="listbox" aria-label="已保存账号"></div></div>
            <label class="sr-only" for="password" data-i18n="password">密码</label>
            <div class="pill-input password-field"><svg class="field-icon" viewBox="0 0 24 24" fill="none" aria-hidden="true"><rect x="5.5" y="10" width="13" height="10" rx="2.5"/><path d="M8.5 10V7a3.5 3.5 0 0 1 7 0v3"/><path d="M12 14v2"/></svg><input id="password" name="password" type="password" placeholder="••••••••••" autocomplete="off" maxlength="128" aria-required="true" aria-describedby="form-status"><button type="button" class="eye-button" id="toggle-password" aria-label="显示密码" aria-pressed="false"><svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M2.5 12S6 6.5 12 6.5 21.5 12 21.5 12 18 17.5 12 17.5 2.5 12 2.5 12Z"/><circle cx="12" cy="12" r="2.5"/><path id="eye-slash" d="m5 4 14 16" hidden/></svg></button></div>
            <div class="agreement-row flex items-center justify-between gap-2"><p><span data-i18n="agreement">点击登录表明您接受以下</span> <button type="button" class="text-link" id="privacy" data-i18n="privacy">隐私条款</button></p><div class="language-control"><label for="language" class="sr-only">界面语言</label><select id="language"><option value="zh-CN">中文简体</option><option value="en">English</option></select><svg viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="m5 6 3 3 3-3"/></svg></div></div>
            <div class="login-preferences" role="group" aria-label="登录选项">
              <label class="preference-check" for="remember-login"><input id="remember-login" type="checkbox"><span class="preference-box" aria-hidden="true"></span><span data-i18n="remember">记住密码</span></label>
              <label class="preference-check" for="auto-login"><input id="auto-login" type="checkbox"><span class="preference-box" aria-hidden="true"></span><span data-i18n="autoLogin">自动登录</span></label>
              <button id="clear-saved-login" class="clear-saved-login" type="button" hidden data-i18n="clearSaved">删除当前保存账号</button>
            </div>
            <button class="login-button w-full rounded-full bg-blue-600 hover:bg-blue-700 text-white font-semibold" type="submit"><span id="login-button-text" data-i18n="login">登录</span><svg viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="M3 8h10m-4-4 4 4-4 4"/></svg></button>
            <p id="form-status" class="form-status" role="status" aria-live="polite"></p>
          </form>
        </section>
      </div>

      <footer class="platform-footer">
        <p class="platform-intro" data-i18n="platforms">我们已经支持下列的软件</p>
        <div id="platforms" class="platform-row flex items-center justify-center" aria-label="多平台生态图标"></div>
        <p id="demo-note" class="demo-note" data-i18n="demo">界面展示 · 登录与平台接入仅为演示</p>
      </footer>
      <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
    </section>
    <button id="restore-window" class="restore-window" hidden><img src="assets/logo.png" width="30" height="30" alt=""><span>超级翻译 · 恢复窗口</span></button>
  </main>
  <dialog id="info-dialog" aria-labelledby="dialog-title"><header><h2 id="dialog-title"></h2><button id="close-dialog" type="button" aria-label="关闭提示">×</button></header><p id="dialog-content"></p><footer><button type="button" id="confirm-dialog" data-i18n="understood">知道了</button></footer></dialog>
  <dialog id="contact-dialog" class="contact-dialog" aria-labelledby="contact-dialog-title">
    <form method="dialog">
      <header><div><h2 id="contact-dialog-title">联系我们</h2><span>扫码添加微信，获取使用帮助</span></div><button id="close-contact-dialog" type="submit" value="cancel" aria-label="关闭联系方式">×</button></header>
      <div class="contact-qr-card"><img src="assets/wechat-contact-qr.jpg" width="260" height="331" alt="超级翻译微信二维码"><strong>扫码二维码，添加我为朋友。</strong><small>如二维码失效，请联系管理员更新。</small></div>
      <footer><button type="submit" value="cancel">知道了</button></footer>
    </form>
  </dialog>
  <dialog id="register-dialog" class="register-dialog" aria-labelledby="register-title">
    <form id="register-form" novalidate>
      <header><div><h2 id="register-title">创建客户账号</h2><span>注册后由管理员分配套餐和翻译额度</span></div><button id="close-register" type="button" aria-label="关闭注册窗口">×</button></header>
      <div class="register-fields">
        <label for="register-account">用户名</label>
        <input id="register-account" name="username" type="text" inputmode="text" autocomplete="username" maxlength="40" pattern="[A-Za-z0-9_]{3,40}" placeholder="3–40 位字母、数字或下划线" required>
        <label for="register-password">密码</label>
        <input id="register-password" name="new-password" type="password" autocomplete="new-password" minlength="8" maxlength="128" placeholder="至少 8 位" required>
        <label for="register-confirm">确认密码</label>
        <input id="register-confirm" name="confirm-password" type="password" autocomplete="new-password" minlength="8" maxlength="128" placeholder="再次输入密码" required>
        <p id="register-status" class="register-status" role="status" aria-live="polite"></p>
      </div>
      <footer><button type="button" id="open-register-page" class="register-web">浏览器注册</button><span class="register-actions"><button type="button" id="cancel-register" class="register-cancel">取消</button><button type="submit" id="submit-register" class="register-submit">注册账号</button></span></footer>
    </form>
  </dialog>
  <script src="platforms.js"></script>
  <script src="app.js"></script>
</body>
</html>
